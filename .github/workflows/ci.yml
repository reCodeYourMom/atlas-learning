name: CI

# À la RACINE du dépôt (revue 2026-09-20) : GitHub Actions ne lit que <racine>/.github/workflows/.
# Le fichier vivait dans 04_code/.github/ — cette CI ne s'était donc jamais déclenchée.

on:
  push:
    branches: [main, demo-mvp]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: 04_code

jobs:
  backend:
    runs-on: ubuntu-latest
    # Postgres réel : dé-skippe le test de concurrence (ATLAS_TEST_PG_URL) et
    # permet de valider les migrations sur PG (attrape la classe de bug
    # VARCHAR(32) d'alembic_version invisible sur SQLite).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Le driver du projet est psycopg v3 (postgresql+psycopg://).
      ATLAS_TEST_PG_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.9 (contrainte du projet — Optional[X], pas X | None)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: 04_code/requirements.txt

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Référentiel — contrôles A1.7 (fractions + brouillon décimaux, graphe combiné)
        run: |
          python scripts/validate_referentiel.py --json > /dev/null
          python scripts/validate_referentiel.py \
            --referentiel data/referentiel_fractions.json \
            --referentiel ../03_referentiel/referentiel_decimals_draft.json

      - name: Crosswalk curriculum — règle B6 (toute compétence active mappée dans chaque framework)
        run: python scripts/validate_crosswalk.py --json > /dev/null

      - name: Migrations sur Postgres vierge (upgrade → downgrade → re-upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 0013
          python -m alembic upgrade head

      - name: Suite de tests (SQLite + test de concurrence PG dé-skippé)
        run: python -m pytest -q

      - name: Jeu de démo de bout en bout (référentiel → banque → AR → activation → école)
        # Ce que rejoue entrypoint-demo.sh au premier boot. Sans réseau, sans LLM.
        env:
          DATABASE_URL: sqlite:///./atlas_ci_demo.db
          ATLAS_ENV: ci
        run: |
          python -m alembic upgrade head
          python scripts/seed_referentiel.py
          python scripts/generate_bank_deterministic.py
          python scripts/translate_bank_ar_deterministic.py
          python demo/provision_demo.py --bank-only
          python demo/seed_demo_school.py --students 24 --weeks 2
          python scripts/replay_measures.py

  web:
    # Le front n'avait AUCUNE étape de CI : une régression TypeScript passait en prod.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_code/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 04_code/web/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
