name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    # Postgres réel : dé-skippe le test de concurrence (ATLAS_TEST_PG_URL) et
    # permet de valider les migrations sur PG (attrape la classe de bug
    # VARCHAR(32) d'alembic_version invisible sur SQLite).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Le driver du projet est psycopg v3 (postgresql+psycopg://).
      ATLAS_TEST_PG_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.9 (contrainte du projet — Optional[X], pas X | None)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Migrations sur Postgres vierge (upgrade → downgrade → re-upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 0013
          python -m alembic upgrade head

      - name: Suite de tests (SQLite + test de concurrence PG dé-skippé)
        run: python -m pytest -q
