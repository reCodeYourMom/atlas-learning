<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas Learning — Session</title>
  <style>
    body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; max-width: 640px;
           margin: 2rem auto; padding: 0 1rem; color: #1a2233; }
    h1 { font-size: 1.2rem; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .5rem 0; }
    input { padding: .4rem; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: .5rem .9rem; border: 1px solid #2b50aa; background: #2b50aa;
             color: #fff; border-radius: 8px; cursor: pointer; }
    button.opt { background: #fff; color: #1a2233; display: block; width: 100%;
                 text-align: start; margin: .4rem 0; }
    button.opt:hover { background: #eef2ff; }
    #stem { font-size: 1.3rem; margin: 1rem 0; }
    .muted { color: #667; font-size: .85rem; }
    [dir="rtl"] #card { text-align: right; }
  </style>
</head>
<body>
  <h1>Atlas Learning — Adaptive Session</h1>

  <div class="row">
    <input id="email" placeholder="email (compte existant)" size="26" />
    <button onclick="login()">Dev sign-in (SSO simulé)</button>
    <span class="muted">Prod : SSO via l'IdP de l'établissement.</span>
  </div>
  <div class="row">
    <input id="student" placeholder="student_id (UUID)" size="36" />
    <button onclick="startSession()">Start session</button>
    <label class="muted">Language:
      <select id="lang" onchange="applyLang()">
        <option value="en">English (LTR)</option>
        <option value="ar">العربية (RTL)</option>
      </select>
    </label>
  </div>

  <div id="card" style="margin-top:1.5rem;">
    <div id="stem" class="muted">Enter IDs and start a session.</div>
    <div id="options"></div>
    <div id="status" class="muted"></div>
  </div>

<script>
let sessionId = null, current = null, token = null;

function lang() { return document.getElementById("lang").value; }

function authHeaders(extra) {
  const h = extra || {};
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}

async function login() {
  // DEV uniquement : simulateur SSO (serveur lancé avec OIDC_DEV_LOGIN=1, ATLAS_ENV non-prod).
  // En prod, l'auth passe par l'IdP (boutons SSO via /auth/providers → /oauth/{provider}/start).
  const r = await fetch("/dev/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: document.getElementById("email").value.trim() })
  });
  if (!r.ok) { setStatus("Sign-in échoué (" + (await r.json()).detail + ")"); return; }
  token = (await r.json()).token;
  setStatus("Connecté.");
}

function applyLang() {
  const l = lang();
  document.documentElement.lang = l;
  document.documentElement.dir = (l === "ar") ? "rtl" : "ltr";  // RTL pour l'arabe
  if (current) render(current);
}

async function startSession() {
  if (!token) { setStatus("Connecte-toi d'abord."); return; }
  const student_id = document.getElementById("student").value.trim();
  const r = await fetch("/sessions", {
    method: "POST", headers: authHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ student_id })
  });
  if (!r.ok) { setStatus("Erreur session (" + (await r.json()).detail + ")"); return; }
  sessionId = (await r.json()).session_id;
  applyLang();
  nextItem();
}

async function nextItem() {
  const r = await fetch(`/sessions/${sessionId}/next-item`, { headers: authHeaders() });
  const data = await r.json();
  render(data);
}

function render(data) {
  current = data;
  const optsDiv = document.getElementById("options");
  optsDiv.innerHTML = "";
  if (data.done) {
    document.getElementById("stem").textContent =
      (lang() === "ar" ? "انتهت الجلسة — السبب: " : "Session finished — reason: ") + data.reason;
    setStatus("");
    return;
  }
  const content = (lang() === "ar" && data.content_ar) ? data.content_ar : data.content_en;
  document.getElementById("stem").textContent = content.stem;
  (content.options || []).forEach(opt => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = opt;
    b.onclick = () => answer(opt);
    optsDiv.appendChild(b);
  });
  setStatus(`competency ${data.competency_id.slice(0, 8)}…`);
}

async function answer(selected) {
  const r = await fetch(`/sessions/${sessionId}/responses`, {
    method: "POST", headers: authHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ item_id: current.item_id, selected, lang: lang() })
  });
  if (r.status === 409) { setStatus("Déjà répondu"); return; }
  render(await r.json());
}

function setStatus(t) { document.getElementById("status").textContent = t; }
</script>
</body>
</html>
