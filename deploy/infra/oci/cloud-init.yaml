#cloud-config
# Atlas — bootstrap VM Ubuntu : Docker + (option) clone du repo + deploy.sh.
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git

write_files:
  - path: /etc/atlas.env
    permissions: "0644"
    content: |
      APP_DOMAIN=${app_domain}
      AUTH_DOMAIN=${auth_domain}
      REPO_URL=${repo_url}

runcmd:
  # Docker Engine + compose plugin
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ubuntu
  # Récupère le bundle si un repo est fourni, sinon laisse la place pour un scp.
  - |
    set -e
    . /etc/atlas.env
    if [ -n "$REPO_URL" ]; then
      cd /home/ubuntu
      git clone "$REPO_URL" repo || true
      # Cherche le dossier deploy/prod (compatible repo racine ou sous-dossier 04_code/)
      D=$(find /home/ubuntu/repo -type d -path '*deploy/prod' | head -n1)
      if [ -n "$D" ]; then
        chown -R ubuntu:ubuntu /home/ubuntu/repo
        sudo -u ubuntu env APP_DOMAIN="$APP_DOMAIN" AUTH_DOMAIN="$AUTH_DOMAIN" bash -lc "cd '$D' && ./deploy.sh"
      fi
    fi
  - echo "[atlas] cloud-init terminé. Si pas de repo_url : scp le bundle puis lance deploy.sh." > /home/ubuntu/ATLAS-READY.txt
  - chown ubuntu:ubuntu /home/ubuntu/ATLAS-READY.txt
