# Compose minimal de DÉRISQUAGE : Keycloak + sa base, pour valider l'intégration OIDC
# (audience mapper → aud=atlas-web) AVANT de construire toute la stack prod.
#
# Durcissement (revue sécu 2026-07-07) :
#   - mode `start` (prod) — plus de `start-dev` ; HTTP local autorisé via KC_HTTP_ENABLED
#     + KC_HOSTNAME_STRICT=false (pas de TLS sur un harnais localhost).
#   - AUCUN credential par défaut (fini admin/admin) : les variables sont OBLIGATOIRES,
#     compose échoue explicitement si elles manquent.
#   - importe le realm de dérisquage (`keycloak/derisk/`, user smoke + ROPC), PAS le
#     template prod — le realm prod n'a ni user de test ni direct access grant.
#
# Usage :
#   KC_ADMIN_USER=admin KC_ADMIN_PASSWORD=<fort> KC_DB_PASSWORD=<fort> \
#     docker compose -f docker-compose.keycloak.yml up -d
name: atlas-kc-derisk

services:
  kc-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD (pas de défaut)}
    volumes:
      - kc_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD (pas de défaut)}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?set KC_ADMIN_USER (pas de défaut admin)}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD (pas de défaut admin)}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Realm DÉRISQUAGE uniquement (user smoke test@demo.atlas + ROPC) — jamais le template prod.
      - ./keycloak/derisk:/opt/keycloak/data/import:ro
    depends_on:
      kc-db:
        condition: service_healthy

volumes:
  kc_db:
